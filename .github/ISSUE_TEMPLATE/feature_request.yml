name: 🚀 Feature request
description: Suggest a new feature or improvement for agent-replay
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please fill out the sections below.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's the pain point? What can't you do today, or what's hard?
      placeholder: I'm trying to ... but agent-replay doesn't ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would ideal look like? A CLI flag, a viewer panel, a new event kind?
      placeholder: I'd love a command that ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds do you use today? Why are they not enough?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core (recorder, replay engine, types)
        - cli (commands)
        - viewer (UI)
        - docs
        - other
    validations:
      required: true
